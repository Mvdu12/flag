<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خمّن العلم</title>
<style>
  :root {
    --navy: #12233d;
    --navy-deep: #0a1626;
    --parchment: #f4ecd8;
    --gold: #c9a24b;
    --gold-bright: #e6c368;
    --stamp-red: #a3372c;
    --green: #4c995a;
    --line: rgba(201,162,75,0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background:
      radial-gradient(circle at 20% 15%, rgba(201,162,75,0.08), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(201,162,75,0.06), transparent 40%),
      var(--navy-deep);
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    color: var(--parchment);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .passport {
    width: 100%; max-width: 580px;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 0 0 6px rgba(201,162,75,0.06), 0 30px 60px rgba(0,0,0,0.5);
    padding: 26px 24px 22px; position: relative; overflow: hidden;
  }
  .passport::before {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid var(--line); border-radius: 8px; pointer-events: none;
  }
  header { text-align: center; margin-bottom: 14px; position: relative; }
  .top-controls {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
  }
  .back-btn, .lang-btn {
    background: none; border: 1px solid var(--line); color: var(--parchment);
    font-size: 12px; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-family: inherit;
  }
  .back-btn:hover, .lang-btn:hover { border-color: var(--gold); color: var(--gold-bright); }
  .eyebrow {
    letter-spacing: 4px; font-size: 11px; color: var(--gold); text-transform: uppercase;
    margin-bottom: 6px; font-weight: 600;
  }
  h1 { font-family: 'Georgia', 'Amiri', serif; font-size: 28px; margin: 0; color: var(--parchment); letter-spacing: 1px; }

  .world-progress { margin-bottom: 18px; }
  .world-progress .wp-label {
    display: flex; justify-content: space-between; font-size: 12px; color: rgba(244,236,216,0.65); margin-bottom: 6px;
  }
  .world-progress .wp-label b { color: var(--gold-bright); }
  .bar-track { height: 8px; border-radius: 4px; background: rgba(244,236,216,0.08); overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-bright)); border-radius: 4px; transition: width 0.4s ease; }

  .continent-grid, .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .continent-card, .mode-card {
    background: rgba(244,236,216,0.04); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 12px; text-align: right; cursor: pointer; font-family: inherit; color: var(--parchment);
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  html[dir="ltr"] .continent-card, html[dir="ltr"] .mode-card { text-align: left; }
  .continent-card:hover, .mode-card:hover { background: rgba(201,162,75,0.1); border-color: var(--gold); }
  .continent-card:active, .mode-card:active { transform: scale(0.98); }
  .continent-card.world { grid-column: 1 / -1; text-align: center; background: rgba(201,162,75,0.08); }
  .mode-card { grid-column: 1 / -1; text-align: center; }
  .cc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .continent-card.world .cc-top, .mode-card .cc-top { justify-content: center; gap: 10px; }
  .cc-emoji { font-size: 20px; }
  .cc-name { font-weight: 700; font-size: 14px; }
  .cc-count { font-size: 11px; color: rgba(244,236,216,0.55); margin-top: 4px; }
  .cc-best { font-size: 11px; color: var(--gold-bright); margin-top: 2px; }
  .continent-card .bar-track { height: 5px; margin-top: 8px; }
  .mode-desc { font-size: 11px; color: rgba(244,236,216,0.5); margin-top: 4px; }

  .top-row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 14px; }
  .lives { font-size: 18px; letter-spacing: 3px; }
  .lives .lost { opacity: 0.25; filter: grayscale(1); }
  .session-score { font-size: 12px; color: rgba(244,236,216,0.6); text-align: left; }
  .session-score b { color: var(--gold-bright); font-size: 16px; }

  .stage {
    background: rgba(244,236,216,0.03); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px 18px; text-align: center; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; min-height: 170px;
  }
  .country-label { font-size: 18px; font-weight: 700; color: var(--gold-bright); }
  .flag-frame {
    width: 180px; height: 120px; border-radius: 6px; overflow: hidden;
    box-shadow: 0 10px 24px rgba(0,0,0,0.5), 0 0 0 1px var(--line); background: rgba(0,0,0,0.15);
  }
  .flag-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .prompt { font-size: 12px; color: rgba(244,236,216,0.5); letter-spacing: 1px; }

  /* شارة النتيجة - تحت العلم مباشرة، مش فوقه، عشان تبان دايمًا */
  .verdict-badge {
    display: inline-flex; align-items: center; gap: 6px;
    border: 2px solid var(--stamp-red); color: var(--stamp-red);
    border-radius: 20px; padding: 6px 16px; font-weight: 800; font-size: 13px;
    opacity: 0; transform: translateY(-6px); transition: all 0.25s ease; max-width: 100%;
  }
  .verdict-badge.show { opacity: 1; transform: translateY(0); }
  .verdict-badge.correct { border-color: var(--green); color: #bfe6c4; background: rgba(76,153,90,0.12); }
  .verdict-badge.wrong { border-color: var(--stamp-red); color: #f0b8b0; background: rgba(163,55,44,0.12); }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; width: 100%; }
  .choice {
    background: rgba(244,236,216,0.04); border: 1px solid var(--line); color: var(--parchment);
    padding: 13px 10px; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit;
    transition: background 0.15s, border-color 0.15s, transform 0.1s; text-align: center;
  }
  .choice:hover:not(:disabled) { background: rgba(201,162,75,0.12); border-color: var(--gold); }
  .choice:active:not(:disabled) { transform: scale(0.97); }
  .choice:disabled { cursor: default; }
  .choice.correct { background: rgba(76,153,90,0.18); border-color: var(--green); color: #bfe6c4; }
  .choice.incorrect { background: rgba(163,55,44,0.18); border-color: var(--stamp-red); color: #f0b8b0; }

  .type-row { display: flex; gap: 8px; margin-top: 4px; width: 100%; }
  .type-input {
    flex: 1; background: rgba(244,236,216,0.05); border: 1px solid var(--line); color: var(--parchment);
    padding: 12px 14px; border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  .type-input:focus { outline: none; border-color: var(--gold); }
  .type-submit {
    background: var(--gold); color: var(--navy-deep); border: none; padding: 0 18px;
    border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  .type-submit:hover { background: var(--gold-bright); }
  .type-submit:disabled { opacity: 0.5; cursor: default; }

  .foot-row { display: flex; justify-content: flex-end; align-items: center; margin-top: 16px; }
  .next-btn {
    background: var(--gold); color: var(--navy-deep); border: none; padding: 11px 22px; border-radius: 7px;
    font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .next-btn.ready { opacity: 1; pointer-events: auto; }
  .next-btn:hover { background: var(--gold-bright); }

  .end-screen { text-align: center; padding: 6px 2px; }
  .end-icon { font-size: 38px; margin-bottom: 4px; }
  .end-screen .big-score { font-size: 40px; font-weight: 800; color: var(--gold-bright); font-family: 'Georgia', serif; margin: 6px 0 2px; }
  .end-screen .of-label { font-size: 12px; color: rgba(244,236,216,0.5); margin-bottom: 14px; }
  .end-screen p.msg { color: rgba(244,236,216,0.75); font-size: 14px; margin: 0 0 16px; }

  .progress-list { text-align: right; border-top: 1px dashed var(--line); padding-top: 14px; margin-bottom: 18px; }
  html[dir="ltr"] .progress-list { text-align: left; }
  .progress-list .pl-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; text-align: center; }
  .pl-row { margin-bottom: 9px; }
  .pl-row .pl-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .pl-row .pl-top span:first-child { color: rgba(244,236,216,0.8); }
  .pl-row .pl-top b { color: var(--gold-bright); }
  .pl-row.total .pl-top span:first-child { font-weight: 700; color: var(--parchment); }
  .pl-row.total { margin-top: 4px; padding-top: 8px; border-top: 1px dashed var(--line); }

  .end-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .restart-btn, .menu-btn {
    padding: 10px 18px; border-radius: 7px; font-weight: 700; cursor: pointer; font-family: inherit;
    font-size: 13px; border: 1px solid var(--gold);
  }
  .restart-btn { background: var(--gold); color: var(--navy-deep); border: none; }
  .restart-btn:hover { background: var(--gold-bright); }
  .menu-btn { background: transparent; color: var(--gold-bright); }
  .menu-btn:hover { background: rgba(201,162,75,0.1); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="passport">
  <header>
    <div class="top-controls">
      <button class="back-btn hidden" id="backBtn">↩ القائمة</button>
      <button class="lang-btn" id="langBtn">English</button>
    </div>
    <div class="eyebrow" id="eyebrowText">جواز السفر العالمي</div>
    <h1 id="titleText">خمّن العلم</h1>
  </header>

  <!-- ===== شاشة القائمة: اختيار القارة ===== -->
  <div id="menuScreen">
    <div class="world-progress">
      <div class="wp-label"><span id="wpLabel">تقدمك حول العالم</span><span><b id="worldKnown">0</b> / <span id="worldTotal">0</span></span></div>
      <div class="bar-track"><div class="bar-fill" id="worldBar" style="width:0%"></div></div>
    </div>
    <div class="continent-grid" id="continentGrid"></div>
  </div>

  <!-- ===== شاشة اختيار نوع اللعبة ===== -->
  <div id="modeScreen" class="hidden">
    <div class="mode-grid" id="modeGrid"></div>
  </div>

  <!-- ===== شاشة اللعب ===== -->
  <div id="gameArea" class="hidden">
    <div class="top-row">
      <div class="lives" id="livesDisplay">❤️❤️❤️</div>
      <div class="session-score"><span id="sessionScoreLabel">صح هذه الجولة</span><br><b id="sessionScore">0</b></div>
    </div>

    <div class="stage">
      <div class="country-label hidden" id="countryLabel"></div>
      <div class="flag-frame"><img id="flagImg" src="" alt="علم الدولة"></div>
      <div class="verdict-badge" id="verdictBadge"></div>
    </div>
    <div class="prompt" id="promptLabel" style="text-align:center;margin-top:6px;"></div>

    <div class="choices hidden" id="choices"></div>
    <div class="type-row hidden" id="typeRow">
      <input type="text" class="type-input" id="typeInput" autocomplete="off">
      <button class="type-submit" id="typeSubmit">تأكيد</button>
    </div>

    <div class="foot-row">
      <button class="next-btn" id="nextBtn">التالي ←</button>
    </div>
  </div>

  <!-- ===== شاشة النهاية ===== -->
  <div id="endScreen" class="end-screen hidden">
    <div class="end-icon" id="endIcon">🏁</div>
    <div class="big-score" id="finalScore">0</div>
    <div class="of-label" id="finalOf">من 0 دولة</div>
    <p class="msg" id="finalMsg">أحسنت!</p>

    <div class="progress-list" id="progressList">
      <div class="pl-title" id="progressTitle">تقدمك المُحدَّث</div>
      <div id="progressRows"></div>
    </div>

    <div class="end-buttons">
      <button class="restart-btn" id="restartBtn">العب تاني</button>
      <button class="menu-btn" id="changeModeBtn">غيّر نوع اللعبة</button>
      <button class="menu-btn" id="menuBtn">القائمة</button>
    </div>
  </div>
</div>

// مجموعات الأعلام اللي بتتشابه في الشكل (ألوان وتصميم قريب من بعض)
// بنستخدمها عشان لما تظهر دولة، الاختيارات الغلط تبقى من نفس المجموعة (أصعب وأذكى)
const CONFUSABLE_GROUPS = [
  ["eg","iq","ye","sy","sd"],           // أحمر-أبيض-أسود أفقي (مصر، العراق، اليمن، سوريا، السودان)
  ["jo","ps","kw","ae"],                 // ألوان العلم العربي: أسود-أبيض-أخضر + مثلث/شريط أحمر
  ["tr","tn"],                           // أحمر بهلال ونجمة
  ["id","mc"],                           // أحمر-أبيض أفقي (إندونيسيا وموناكو)
  ["td","ro"],                           // أزرق-أصفر-أحمر رأسي (تشاد ورومانيا)
  ["nl","lu"],                           // أحمر-أبيض-أزرق أفقي (هولندا ولوكسمبورغ)
  ["ie","ci"],                           // أخضر-أبيض-برتقالي (أيرلندا وساحل العاج، بترتيب معكوس)
  ["co","ec","ve"],                      // أصفر-أزرق-أحمر أفقي (كولومبيا، الإكوادور، فنزويلا)
  ["sn","ml","gn"],                      // أخضر-أصفر-أحمر رأسي (السنغال، مالي، غينيا)
  ["au","nz"],                           // علم بريطاني + نجوم على أزرق
  ["si","sk","ru"],                      // أبيض-أزرق-أحمر أفقي (سلوفينيا، سلوفاكيا، روسيا)
  ["dk","no","is","se","fi"],            // الصليب الاسكندنافي (الدنمارك، النرويج، آيسلندا، السويد، فنلندا)
  ["ne","in"],                           // برتقالي-أبيض-أخضر أفقي بدائرة في النص (النيجر، الهند)
  ["ro","td"],
  ["bo","co","ec","ve"],                 // أصفر-أحمر-أزرق مشابه لمجموعة كولومبيا
];

const confusableMap = {};
CONFUSABLE_GROUPS.forEach(group => {
  group.forEach(code => {
    if (!confusableMap[code]) confusableMap[code] = new Set();
    group.forEach(other => { if (other !== code) confusableMap[code].add(other); });
  });
});

function getWrongOptions(correct, fallbackPool, count) {
  const confSet = confusableMap[correct.code] ? [...confusableMap[correct.code]] : [];
  let confCountries = shuffle(confSet.map(code => countries.find(c => c.code === code)).filter(Boolean));
  let candidates = confCountries.slice(0, count);

  if (candidates.length < count) {
    const usedCodes = new Set([correct.code, ...candidates.map(c => c.code)]);
    const needed = count - candidates.length;
    const source = fallbackPool.length >= count + 1 ? fallbackPool : countries;
    const extra = shuffle(source.filter(c => !usedCodes.has(c.code))).slice(0, needed);
    candidates = candidates.concat(extra);
  }
  return candidates;
}

    promptFlag: "Which country is this flag?", promptCap: "What's the capital of this country?",
    correctBadge: "✅ Correct!", wrongBadge: n => `❌ Correct: ${n}`,
    typePlaceholderCountry: "Type the country name...", typePlaceholderCapital: "Type the capital name...",
    submit: "Submit", next: "Next →", sessionScoreLabel: "Correct this round",
    ofCount: n => `correct out of ${n}`,
    cleared: "Bravo! You cleared every country here without losing 3 times!",
    zero: "Time to review the world map — try again!",
    great: "Great job! You lost only after knowing quite a lot.",
    ok: "Not bad! Keep playing to improve your score.",
    updatedProgress: "Your updated progress", playAgain: "Play again", changeMode: "Change mode", menu: "Menu",
    chooseModeTitle: "Choose a game mode",
  }
};

const MAX_LIVES = 3;
let LANG = "ar";

function flagUrl(code) { return `https://flagcdn.com/w320/${code}.png`; }
function t() { return STR[LANG]; }
function nameOf(c) { return LANG === "ar" ? c.ar : c.en; }
function capOf(c) { return LANG === "ar" ? c.capAr : c.capEn; }
function contName(cont) { return LANG === "ar" ? cont.ar : cont.en; }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalize(str) {
  str = (str || "").trim().toLowerCase();
  if (LANG === "ar") {
    str = str.replace(/[\u064B-\u0652]/g, "");
    str = str.replace(/[إأآا]/g, "ا");
    str = str.replace(/ى/g, "ي");
    str = str.replace(/ة/g, "ه");
    str = str.replace(/^ال/, "");
    str = str.replace(/[^ء-ي0-9 ]/g, "");
  } else {
    str = str.replace(/^the /, "");
    str = str.replace(/[^a-z0-9 ]/g, "");
  }
  return str.replace(/\s+/g, " ").trim();
}

/* ============== حالة عامة تتراكم بين الجولات (في الذاكرة فقط) ============== */
const knownCodes = new Set();       // أكواد الدول اللي اتعرفت صح (بأي وضع لعب)
const highScores = {};              // أعلى نتيجة في جولة واحدة لكل مفتاح (قارة أو "world")

function countInContinent(key) { return countries.filter(c => c.cont === key).length; }
function knownInContinent(key) { return countries.filter(c => c.cont === key && knownCodes.has(c.code)).length; }

/* ================= عناصر DOM ================= */
const htmlRoot = document.getElementById('htmlRoot');
const menuScreen = document.getElementById('menuScreen');
const modeScreen = document.getElementById('modeScreen');
const gameArea = document.getElementById('gameArea');
const endScreen = document.getElementById('endScreen');
const backBtn = document.getElementById('backBtn');
const langBtn = document.getElementById('langBtn');
const eyebrowText = document.getElementById('eyebrowText');
const titleText = document.getElementById('titleText');

const continentGrid = document.getElementById('continentGrid');
const wpLabel = document.getElementById('wpLabel');
const worldKnownEl = document.getElementById('worldKnown');
const worldTotalEl = document.getElementById('worldTotal');
const worldBar = document.getElementById('worldBar');
const modeGrid = document.getElementById('modeGrid');

const livesDisplay = document.getElementById('livesDisplay');
const sessionScoreLabelEl = document.getElementById('sessionScoreLabel');
const sessionScoreEl = document.getElementById('sessionScore');
const countryLabel = document.getElementById('countryLabel');
const flagImg = document.getElementById('flagImg');
const verdictBadge = document.getElementById('verdictBadge');
const promptLabel = document.getElementById('promptLabel');
const choicesEl = document.getElementById('choices');
const typeRow = document.getElementById('typeRow');
const typeInput = document.getElementById('typeInput');
const typeSubmit = document.getElementById('typeSubmit');
const nextBtn = document.getElementById('nextBtn');

const endIcon = document.getElementById('endIcon');
const finalScore = document.getElementById('finalScore');
const finalOf = document.getElementById('finalOf');
const finalMsg = document.getElementById('finalMsg');
const progressTitle = document.getElementById('progressTitle');
const progressRows = document.getElementById('progressRows');
const restartBtn = document.getElementById('restartBtn');
const changeModeBtn = document.getElementById('changeModeBtn');
const menuBtn = document.getElementById('menuBtn');

function showScreen(el) {
  [menuScreen, modeScreen, gameArea, endScreen].forEach(s => s.classList.add('hidden'));
  el.classList.remove('hidden');
  backBtn.classList.toggle('hidden', el === menuScreen);
}

/* ================= اللغة ================= */
function applyStaticText() {
  htmlRoot.setAttribute('dir', LANG === 'ar' ? 'rtl' : 'ltr');
  htmlRoot.setAttribute('lang', LANG === 'ar' ? 'ar' : 'en');
  eyebrowText.textContent = t().eyebrow;
  titleText.textContent = t().title;
  backBtn.textContent = t().back;
  langBtn.textContent = t().langBtn;
  wpLabel.textContent = t().wpLabel;
  sessionScoreLabelEl.textContent = t().sessionScoreLabel;
  typeSubmit.textContent = t().submit;
  nextBtn.textContent = t().next;
}

langBtn.addEventListener('click', () => {
  LANG = LANG === 'ar' ? 'en' : 'ar';
  applyStaticText();
  // إعادة رسم الشاشة الحالية باللغة الجديدة
  if (!menuScreen.classList.contains('hidden')) renderMenu();
  else if (!modeScreen.classList.contains('hidden')) renderModeScreen();
  else if (!gameArea.classList.contains('hidden')) { updateGameHeader(); renderRound(); }
  else if (!endScreen.classList.contains('hidden')) renderEndScreen(lastEndReason);
});

/* ================= شاشة القائمة (اختيار القارة) ================= */
function renderMenu() {
  worldTotalEl.textContent = countries.length;
  worldKnownEl.textContent = knownCodes.size;
  worldBar.style.width = `${(knownCodes.size / countries.length) * 100}%`;

  continentGrid.innerHTML = '';

  const worldBest = highScores['world'] || 0;
  const worldCard = document.createElement('button');
  worldCard.className = 'continent-card world';
  worldCard.innerHTML = `
    <div class="cc-top"><span class="cc-emoji">🌐</span><span class="cc-name">${t().world}</span></div>
    <div class="cc-count">${knownCodes.size} / ${countries.length} ${t().knownSuffix}</div>
    <div class="cc-best">${t().best(worldBest)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${(knownCodes.size/countries.length)*100}%"></div></div>
  `;
  worldCard.addEventListener('click', () => openModeScreen(null));
  continentGrid.appendChild(worldCard);

  CONTINENTS.forEach(cont => {
    const total = countInContinent(cont.key);
    const known = knownInContinent(cont.key);
    const best = highScores[cont.key] || 0;
    const card = document.createElement('button');
    card.className = 'continent-card';
    card.innerHTML = `
      <div class="cc-top"><span class="cc-emoji">${cont.emoji}</span><span class="cc-name">${contName(cont)}</span></div>
      <div class="cc-count">${known} / ${total} ${t().knownSuffix}</div>
      <div class="cc-best">${t().best(best)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(known/total)*100}%"></div></div>
    `;
    card.addEventListener('click', () => openModeScreen(cont.key));
    continentGrid.appendChild(card);
  });
}

/* ================= شاشة اختيار نوع اللعبة ================= */
let pendingContinentKey = null;

function openModeScreen(continentKey) {
  pendingContinentKey = continentKey;
  renderModeScreen();
  showScreen(modeScreen);
}

function renderModeScreen() {
  const modes = [
    { id: "flag_choice", label: t().modeFlagChoice, desc: t().modeFlagChoiceDesc },
    { id: "flag_type",   label: t().modeFlagType,   desc: t().modeFlagTypeDesc },
    { id: "cap_choice",  label: t().modeCapChoice,  desc: t().modeCapChoiceDesc },
    { id: "cap_type",    label: t().modeCapType,    desc: t().modeCapTypeDesc },
  ];
  modeGrid.innerHTML = '';
  modes.forEach(m => {
    const card = document.createElement('button');
    card.className = 'mode-card';
    card.innerHTML = `<div class="cc-name">${m.label}</div><div class="mode-desc">${m.desc}</div>`;
    card.addEventListener('click', () => startGame(pendingContinentKey, m.id));
    modeGrid.appendChild(card);
  });
}

/* ================= منطق اللعبة ================= */
let pool = [];
let deck = [];
let deckIndex = 0;
let lives = MAX_LIVES;
let sessionCorrect = 0;
let currentContinentKey = null;
let currentMode = "flag_choice";
let answered = false;
let currentCorrect = null;
let lastEndReason = null;

function startGame(continentKey, mode) {
  currentContinentKey = continentKey;
  currentMode = mode;
  pool = continentKey ? countries.filter(c => c.cont === continentKey) : countries;
  deck = shuffle(pool);
  deckIndex = 0;
  lives = MAX_LIVES;
  sessionCorrect = 0;

  showScreen(gameArea);
  updateGameHeader();
  renderRound();
}

function updateGameHeader() {
  livesDisplay.innerHTML = '❤️'.repeat(lives) + '<span class="lost">' + '🖤'.repeat(MAX_LIVES - lives) + '</span>';
  sessionScoreEl.textContent = sessionCorrect;
}

function isCapitalMode() { return currentMode === 'cap_choice' || currentMode === 'cap_type'; }
function isTypeMode() { return currentMode === 'flag_type' || currentMode === 'cap_type'; }

function renderRound() {
  if (deckIndex >= deck.length) { endGame('cleared'); return; }
  if (lives <= 0) { endGame('lost'); return; }

  answered = false;
  verdictBadge.classList.remove('show', 'correct', 'wrong');
  verdictBadge.textContent = '';
  nextBtn.classList.remove('ready');
  typeInput.value = '';
  typeInput.disabled = false;
  typeSubmit.disabled = false;

  currentCorrect = deck[deckIndex];
  flagImg.src = flagUrl(currentCorrect.code);
  flagImg.alt = nameOf(currentCorrect);

  const capMode = isCapitalMode();
  countryLabel.classList.toggle('hidden', !capMode);
  if (capMode) countryLabel.textContent = nameOf(currentCorrect);
  promptLabel.textContent = capMode ? t().promptCap : t().promptFlag;

  const typeMode = isTypeMode();
  choicesEl.classList.toggle('hidden', typeMode);
  typeRow.classList.toggle('hidden', !typeMode);

  if (!typeMode) {
    const wrongPool = getWrongOptions(currentCorrect, pool, 3);
    const options = shuffle([currentCorrect, ...wrongPool]);
    choicesEl.innerHTML = '';
    options.forEach(opt => {
      const label = capMode ? capOf(opt) : nameOf(opt);
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = label;
      btn.addEventListener('click', () => selectChoice(opt, btn));
      choicesEl.appendChild(btn);
    });
  } else {
    typeInput.placeholder = capMode ? t().typePlaceholderCapital : t().typePlaceholderCountry;
    typeInput.dir = LANG === 'ar' ? 'rtl' : 'ltr';
    setTimeout(() => typeInput.focus(), 50);
  }

  promptLabel.dataset.remaining = deck.length - deckIndex;
  promptLabel.textContent += `  •  ${t().remaining(deck.length - deckIndex)}`;
  updateGameHeader();
}

function markResult(isCorrect, correctLabel) {
  if (isCorrect) {
    sessionCorrect++;
    knownCodes.add(currentCorrect.code);
    verdictBadge.textContent = t().correctBadge;
    verdictBadge.classList.add('correct');
  } else {
    lives--;
    verdictBadge.textContent = t().wrongBadge(correctLabel);
    verdictBadge.classList.add('wrong');
  }
  verdictBadge.classList.add('show');
  updateGameHeader();
  nextBtn.classList.add('ready');
}

function selectChoice(opt, btnEl) {
  if (answered) return;
  answered = true;
  const isCorrect = opt.code === currentCorrect.code;
  const correctLabel = isCapitalMode() ? capOf(currentCorrect) : nameOf(currentCorrect);
  [...choicesEl.children].forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === correctLabel) btn.classList.add('correct');
    else if (btn === btnEl) btn.classList.add('incorrect');
  });
  markResult(isCorrect, correctLabel);
}

function submitTyped() {
  if (answered) return;
  answered = true;
  const correctLabel = isCapitalMode() ? capOf(currentCorrect) : nameOf(currentCorrect);
  const isCorrect = normalize(typeInput.value) === normalize(correctLabel) && normalize(typeInput.value).length > 0;
  typeInput.disabled = true;
  typeSubmit.disabled = true;
  markResult(isCorrect, correctLabel);
}

typeSubmit.addEventListener('click', submitTyped);
typeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitTyped(); });

nextBtn.addEventListener('click', () => {
  deckIndex++;
  if (lives <= 0) { endGame('lost'); return; }
  renderRound();
});

function endGame(reason) {
  lastEndReason = reason;
  const key = currentContinentKey || 'world';
  highScores[key] = Math.max(highScores[key] || 0, sessionCorrect);
  renderEndScreen(reason);
  showScreen(endScreen);
}

function renderEndScreen(reason) {
  finalScore.textContent = sessionCorrect;
  finalOf.textContent = t().ofCount(pool.length);

  if (reason === 'cleared') { endIcon.textContent = '🏆'; finalMsg.textContent = t().cleared; }
  else if (sessionCorrect === 0) { endIcon.textContent = '🗺️'; finalMsg.textContent = t().zero; }
  else if (sessionCorrect >= pool.length * 0.7) { endIcon.textContent = '👏'; finalMsg.textContent = t().great; }
  else { endIcon.textContent = '🚩'; finalMsg.textContent = t().ok; }

  progressTitle.textContent = t().updatedProgress;
  restartBtn.textContent = t().playAgain;
  changeModeBtn.textContent = t().changeMode;
  menuBtn.textContent = t().menu;
  renderProgressList();
}

function renderProgressList() {
  progressRows.innerHTML = '';
  const totalRow = document.createElement('div');
  totalRow.className = 'pl-row total';
  totalRow.innerHTML = `
    <div class="pl-top"><span>🌐 ${t().world}</span><b>${knownCodes.size} / ${countries.length}</b></div>
    <div class="bar-track"><div class="bar-fill" style="width:${(knownCodes.size/countries.length)*100}%"></div></div>
  `;
  progressRows.appendChild(totalRow);

  CONTINENTS.forEach(cont => {
    const total = countInContinent(cont.key);
    const known = knownInContinent(cont.key);
    const row = document.createElement('div');
    row.className = 'pl-row';
    row.innerHTML = `
      <div class="pl-top"><span>${cont.emoji} ${contName(cont)}</span><b>${known} / ${total}</b></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(known/total)*100}%"></div></div>
    `;
    progressRows.appendChild(row);
  });
}

restartBtn.addEventListener('click', () => startGame(currentContinentKey, currentMode));
changeModeBtn.addEventListener('click', () => openModeScreen(currentContinentKey));
menuBtn.addEventListener('click', () => { renderMenu(); showScreen(menuScreen); });
backBtn.addEventListener('click', () => {
  if (!modeScreen.classList.contains('hidden')) { renderMenu(); showScreen(menuScreen); }
  else { renderMenu(); showScreen(menuScreen); }
});

applyStaticText();
renderMenu();
showScreen(menuScreen);
</script>
