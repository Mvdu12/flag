<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خمّن العلم</title>
<style>
  :root {
    --navy: #12233d;
    --navy-deep: #0a1626;
    --parchment: #f4ecd8;
    --gold: #c9a24b;
    --gold-bright: #e6c368;
    --stamp-red: #a3372c;
    --green: #4c995a;
    --ink: #22314a;
    --line: rgba(201,162,75,0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 15%, rgba(201,162,75,0.08), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(201,162,75,0.06), transparent 40%),
      var(--navy-deep);
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    color: var(--parchment);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .passport {
    width: 100%;
    max-width: 560px;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow:
      0 0 0 6px rgba(201,162,75,0.06),
      0 30px 60px rgba(0,0,0,0.5);
    padding: 28px 26px 24px;
    position: relative;
    overflow: hidden;
  }

  .passport::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    pointer-events: none;
  }

  header {
    text-align: center;
    margin-bottom: 14px;
    position: relative;
  }

  .eyebrow {
    letter-spacing: 4px;
    font-size: 11px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
  }

  h1 {
    font-family: 'Georgia', 'Amiri', serif;
    font-size: 30px;
    margin: 0;
    color: var(--parchment);
    letter-spacing: 1px;
  }

  .back-btn {
    position: absolute;
    right: 0;
    top: 2px;
    background: none;
    border: 1px solid var(--line);
    color: var(--parchment);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .back-btn:hover { border-color: var(--gold); color: var(--gold-bright); }

  /* ===== World progress strip (shown on menu) ===== */
  .world-progress {
    margin-bottom: 18px;
  }
  .world-progress .wp-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: rgba(244,236,216,0.65);
    margin-bottom: 6px;
  }
  .world-progress .wp-label b { color: var(--gold-bright); }
  .bar-track {
    height: 8px;
    border-radius: 4px;
    background: rgba(244,236,216,0.08);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-bright));
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  /* ===== Continent menu ===== */
  .continent-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .continent-card {
    background: rgba(244,236,216,0.04);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 12px;
    text-align: right;
    cursor: pointer;
    font-family: inherit;
    color: var(--parchment);
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .continent-card:hover { background: rgba(201,162,75,0.1); border-color: var(--gold); }
  .continent-card:active { transform: scale(0.98); }
  .continent-card.world {
    grid-column: 1 / -1;
    text-align: center;
    background: rgba(201,162,75,0.08);
  }
  .cc-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .continent-card.world .cc-top { justify-content: center; gap: 10px; }
  .cc-emoji { font-size: 20px; }
  .cc-name { font-weight: 700; font-size: 14px; }
  .cc-count { font-size: 11px; color: rgba(244,236,216,0.55); margin-top: 4px; }
  .continent-card .bar-track { height: 5px; margin-top: 8px; }

  /* ===== Game screen ===== */
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 4px 0 14px;
  }
  .lives { font-size: 18px; letter-spacing: 3px; }
  .lives .lost { opacity: 0.25; filter: grayscale(1); }
  .session-score { font-size: 12px; color: rgba(244,236,216,0.6); text-align: left; }
  .session-score b { color: var(--gold-bright); font-size: 16px; }

  .stage {
    background: rgba(244,236,216,0.03);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 18px;
    text-align: center;
    position: relative;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .flag-frame {
    width: 180px;
    height: 120px;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 10px 24px rgba(0,0,0,0.5), 0 0 0 1px var(--line);
    margin-bottom: 12px;
    background: rgba(0,0,0,0.15);
  }
  .flag-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .prompt {
    font-size: 13px;
    color: rgba(244,236,216,0.55);
    letter-spacing: 1px;
  }

  .stamp {
    position: absolute;
    top: 10px;
    left: 10px;
    border: 3px solid var(--stamp-red);
    color: var(--stamp-red);
    border-radius: 50%;
    width: 70px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 12px;
    text-align: center;
    transform: rotate(-18deg) scale(0);
    opacity: 0;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.25s;
    pointer-events: none;
    background: rgba(163,55,44,0.06);
  }
  .stamp.show { transform: rotate(-18deg) scale(1); opacity: 0.9; }
  .stamp.wrong { border-color: #888; color: #999; }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
  }

  .choice {
    background: rgba(244,236,216,0.04);
    border: 1px solid var(--line);
    color: var(--parchment);
    padding: 13px 10px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    text-align: center;
  }

  .choice:hover:not(:disabled) {
    background: rgba(201,162,75,0.12);
    border-color: var(--gold);
  }

  .choice:active:not(:disabled) { transform: scale(0.97); }
  .choice:disabled { cursor: default; }

  .choice.correct {
    background: rgba(76,153,90,0.18);
    border-color: var(--green);
    color: #bfe6c4;
  }

  .choice.incorrect {
    background: rgba(163,55,44,0.18);
    border-color: var(--stamp-red);
    color: #f0b8b0;
  }

  .foot-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-top: 18px;
  }

  .next-btn {
    background: var(--gold);
    color: var(--navy-deep);
    border: none;
    padding: 11px 22px;
    border-radius: 7px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .next-btn.ready { opacity: 1; pointer-events: auto; }
  .next-btn:hover { background: var(--gold-bright); }

  /* ===== End screen ===== */
  .end-screen { text-align: center; padding: 6px 2px; }
  .end-icon { font-size: 40px; margin-bottom: 4px; }
  .end-screen .big-score {
    font-size: 42px;
    font-weight: 800;
    color: var(--gold-bright);
    font-family: 'Georgia', serif;
    margin: 6px 0 2px;
  }
  .end-screen .of-label { font-size: 12px; color: rgba(244,236,216,0.5); margin-bottom: 16px; }
  .end-screen p.msg { color: rgba(244,236,216,0.75); font-size: 14px; margin: 0 0 18px; }

  .progress-list {
    text-align: right;
    border-top: 1px dashed var(--line);
    padding-top: 14px;
    margin-bottom: 18px;
  }
  .progress-list .pl-title {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
    text-align: center;
  }
  .pl-row { margin-bottom: 9px; }
  .pl-row .pl-top {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 4px;
  }
  .pl-row .pl-top span:first-child { color: rgba(244,236,216,0.8); }
  .pl-row .pl-top b { color: var(--gold-bright); }
  .pl-row.total .pl-top span:first-child { font-weight: 700; color: var(--parchment); }
  .pl-row.total { margin-top: 4px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .pl-row.updated .bar-fill { background: linear-gradient(90deg, var(--green), #7ac488); }

  .end-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .restart-btn, .menu-btn {
    padding: 10px 20px;
    border-radius: 7px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    border: 1px solid var(--gold);
  }
  .restart-btn { background: var(--gold); color: var(--navy-deep); border: none; }
  .restart-btn:hover { background: var(--gold-bright); }
  .menu-btn { background: transparent; color: var(--gold-bright); }
  .menu-btn:hover { background: rgba(201,162,75,0.1); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="passport">
  <header>
    <button class="back-btn hidden" id="backBtn">↩ القائمة</button>
    <div class="eyebrow">جواز السفر العالمي</div>
    <h1>خمّن العلم</h1>
  </header>

  <!-- ===== شاشة القائمة: اختيار القارة ===== -->
  <div id="menuScreen">
    <div class="world-progress">
      <div class="wp-label"><span>تقدمك حول العالم</span><span><b id="worldKnown">0</b> / <span id="worldTotal">0</span></span></div>
      <div class="bar-track"><div class="bar-fill" id="worldBar" style="width:0%"></div></div>
    </div>

    <div class="continent-grid" id="continentGrid"></div>
  </div>

  <!-- ===== شاشة اللعب ===== -->
  <div id="gameArea" class="hidden">
    <div class="top-row">
      <div class="lives" id="livesDisplay">❤️❤️❤️</div>
      <div class="session-score">صح هذه الجولة<br><b id="sessionScore">0</b></div>
    </div>

    <div class="stage">
      <div class="stamp" id="stamp">صحيح</div>
      <div class="flag-frame"><img id="flagImg" src="" alt="علم الدولة"></div>
      <div class="prompt" id="promptLabel">دي علم أنهي دولة؟</div>
    </div>

    <div class="choices" id="choices"></div>

    <div class="foot-row">
      <button class="next-btn" id="nextBtn">التالي ←</button>
    </div>
  </div>

  <!-- ===== شاشة النهاية ===== -->
  <div id="endScreen" class="end-screen hidden">
    <div class="end-icon" id="endIcon">🏁</div>
    <div class="big-score" id="finalScore">0</div>
    <div class="of-label" id="finalOf">من 0 دولة</div>
    <p class="msg" id="finalMsg">أحسنت!</p>

    <div class="progress-list" id="progressList">
      <div class="pl-title">تقدمك المُحدَّث</div>
      <div id="progressRows"></div>
    </div>

    <div class="end-buttons">
      <button class="restart-btn" id="restartBtn">العب تاني</button>
      <button class="menu-btn" id="menuBtn">القائمة</button>
    </div>
  </div>
</div>

    { name: "صربيا", code: "rs", cont: "europe" }, { name: "سلوفاكيا", code: "sk", cont: "europe" },
    { name: "سلوفينيا", code: "si", cont: "europe" }, { name: "إسبانيا", code: "es", cont: "europe" },
    { name: "السويد", code: "se", cont: "europe" }, { name: "سويسرا", code: "ch", cont: "europe" },
    { name: "أوكرانيا", code: "ua", cont: "europe" }, { name: "بريطانيا", code: "gb", cont: "europe" },
    { name: "الفاتيكان", code: "va", cont: "europe" },
    // أمريكا الشمالية والكاريبي
    { name: "أنتيغوا وباربودا", code: "ag", cont: "namerica" }, { name: "جزر البهاما", code: "bs", cont: "namerica" },
    { name: "بربادوس", code: "bb", cont: "namerica" }, { name: "بليز", code: "bz", cont: "namerica" },
    { name: "كندا", code: "ca", cont: "namerica" }, { name: "كوستاريكا", code: "cr", cont: "namerica" },
    { name: "كوبا", code: "cu", cont: "namerica" }, { name: "دومينيكا", code: "dm", cont: "namerica" },
    { name: "جمهورية الدومينيكان", code: "do", cont: "namerica" }, { name: "السلفادور", code: "sv", cont: "namerica" },
    { name: "غرينادا", code: "gd", cont: "namerica" }, { name: "غواتيمالا", code: "gt", cont: "namerica" },
    { name: "هايتي", code: "ht", cont: "namerica" }, { name: "هندوراس", code: "hn", cont: "namerica" },
    { name: "جامايكا", code: "jm", cont: "namerica" }, { name: "المكسيك", code: "mx", cont: "namerica" },
    { name: "نيكاراغوا", code: "ni", cont: "namerica" }, { name: "بنما", code: "pa", cont: "namerica" },
    { name: "سانت كيتس ونيفيس", code: "kn", cont: "namerica" }, { name: "سانت لوسيا", code: "lc", cont: "namerica" },
    { name: "سانت فينسنت والغرينادين", code: "vc", cont: "namerica" }, { name: "ترينيداد وتوباغو", code: "tt", cont: "namerica" },
    { name: "أمريكا", code: "us", cont: "namerica" },
    // أمريكا الجنوبية
    { name: "الأرجنتين", code: "ar", cont: "samerica" }, { name: "بوليفيا", code: "bo", cont: "samerica" },
    { name: "البرازيل", code: "br", cont: "samerica" }, { name: "تشيلي", code: "cl", cont: "samerica" },
    { name: "كولومبيا", code: "co", cont: "samerica" }, { name: "الإكوادور", code: "ec", cont: "samerica" },
    { name: "غيانا", code: "gy", cont: "samerica" }, { name: "باراغواي", code: "py", cont: "samerica" },
    { name: "بيرو", code: "pe", cont: "samerica" }, { name: "سورينام", code: "sr", cont: "samerica" },
    { name: "أوروغواي", code: "uy", cont: "samerica" }, { name: "فنزويلا", code: "ve", cont: "samerica" },
    // أوقيانوسيا
    { name: "أستراليا", code: "au", cont: "oceania" }, { name: "فيجي", code: "fj", cont: "oceania" },
    { name: "كيريباتي", code: "ki", cont: "oceania" }, { name: "جزر مارشال", code: "mh", cont: "oceania" },
    { name: "ميكرونيسيا", code: "fm", cont: "oceania" }, { name: "ناورو", code: "nr", cont: "oceania" },
    { name: "نيوزيلندا", code: "nz", cont: "oceania" }, { name: "بالاو", code: "pw", cont: "oceania" },
    { name: "بابوا غينيا الجديدة", code: "pg", cont: "oceania" }, { name: "ساموا", code: "ws", cont: "oceania" },
    { name: "جزر سليمان", code: "sb", cont: "oceania" }, { name: "تونغا", code: "to", cont: "oceania" },
    { name: "توفالو", code: "tv", cont: "oceania" }, { name: "فانواتو", code: "vu", cont: "oceania" },
  ];

  const CONTINENTS = [
    { key: "africa",   name: "أفريقيا",             emoji: "🌍" },
    { key: "asia",     name: "آسيا",                 emoji: "🌏" },
    { key: "europe",   name: "أوروبا",               emoji: "🌍" },
    { key: "namerica", name: "أمريكا الشمالية",      emoji: "🌎" },
    { key: "samerica", name: "أمريكا الجنوبية",      emoji: "🌎" },
    { key: "oceania",  name: "أوقيانوسيا",           emoji: "🌏" },
  ];

  const MAX_LIVES = 3;

  function flagUrl(code) { return `https://flagcdn.com/w320/${code}.png`; }
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ==========================================================
     الحالة العامة: مجموعة أكواد الدول اللي المستخدم عرفها صح
     (بتفضل موجودة طول ما الصفحة مفتوحة، وبتتراكم بين الجولات)
  ========================================================== */
  const knownCodes = new Set();

  function countInContinent(key) {
    return countries.filter(c => c.cont === key).length;
  }
  function knownInContinent(key) {
    return countries.filter(c => c.cont === key && knownCodes.has(c.code)).length;
  }

  /* ================= شاشات ================= */
  const menuScreen = document.getElementById('menuScreen');
  const gameArea = document.getElementById('gameArea');
  const endScreen = document.getElementById('endScreen');
  const backBtn = document.getElementById('backBtn');

  const continentGrid = document.getElementById('continentGrid');
  const worldKnownEl = document.getElementById('worldKnown');
  const worldTotalEl = document.getElementById('worldTotal');
  const worldBar = document.getElementById('worldBar');

  const livesDisplay = document.getElementById('livesDisplay');
  const sessionScoreEl = document.getElementById('sessionScore');
  const flagImg = document.getElementById('flagImg');
  const choicesEl = document.getElementById('choices');
  const stamp = document.getElementById('stamp');
  const nextBtn = document.getElementById('nextBtn');
  const promptLabel = document.getElementById('promptLabel');

  const endIcon = document.getElementById('endIcon');
  const finalScore = document.getElementById('finalScore');
  const finalOf = document.getElementById('finalOf');
  const finalMsg = document.getElementById('finalMsg');
  const progressRows = document.getElementById('progressRows');
  const restartBtn = document.getElementById('restartBtn');
  const menuBtn = document.getElementById('menuBtn');

  function showScreen(el) {
    [menuScreen, gameArea, endScreen].forEach(s => s.classList.add('hidden'));
    el.classList.remove('hidden');
    backBtn.classList.toggle('hidden', el === menuScreen);
  }

  /* ================= بناء قائمة القارات ================= */
  function renderMenu() {
    worldTotalEl.textContent = countries.length;
    worldKnownEl.textContent = knownCodes.size;
    worldBar.style.width = `${(knownCodes.size / countries.length) * 100}%`;

    continentGrid.innerHTML = '';

    const worldCard = document.createElement('button');
    worldCard.className = 'continent-card world';
    worldCard.innerHTML = `
      <div class="cc-top"><span class="cc-emoji">🌐</span><span class="cc-name">العالم كله</span></div>
      <div class="cc-count">${knownCodes.size} / ${countries.length} دولة اتعرفت</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(knownCodes.size/countries.length)*100}%"></div></div>
    `;
    worldCard.addEventListener('click', () => startGame(null));
    continentGrid.appendChild(worldCard);

    CONTINENTS.forEach(cont => {
      const total = countInContinent(cont.key);
      const known = knownInContinent(cont.key);
      const card = document.createElement('button');
      card.className = 'continent-card';
      card.innerHTML = `
        <div class="cc-top"><span class="cc-emoji">${cont.emoji}</span><span class="cc-name">${cont.name}</span></div>
        <div class="cc-count">${known} / ${total} دولة اتعرفت</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(known/total)*100}%"></div></div>
      `;
      card.addEventListener('click', () => startGame(cont.key));
      continentGrid.appendChild(card);
    });
  }

  /* ================= منطق اللعبة ================= */
  let pool = [];        // الدول المتاحة للاختيار منها في الجولة دي
  let deck = [];        // ترتيب عشوائي للدول اللي هتتعرض
  let deckIndex = 0;
  let lives = MAX_LIVES;
  let sessionCorrect = 0;
  let sessionSeen = new Set(); // عشان منكررش بلد في نفس الجولة
  let currentContinentKey = null; // null = العالم كله
  let answered = false;
  let currentCorrect = null;

  function startGame(continentKey) {
    currentContinentKey = continentKey;
    pool = continentKey ? countries.filter(c => c.cont === continentKey) : countries;
    deck = shuffle(pool);
    deckIndex = 0;
    lives = MAX_LIVES;
    sessionCorrect = 0;
    sessionSeen = new Set();

    showScreen(gameArea);
    updateGameHeader();
    nextRound();
  }

  function updateGameHeader() {
    livesDisplay.innerHTML = '❤️'.repeat(lives) + '<span class="lost">' + '🖤'.repeat(MAX_LIVES - lives) + '</span>';
    sessionScoreEl.textContent = sessionCorrect;
  }

  function nextRound() {
    if (deckIndex >= deck.length) { endGame('cleared'); return; }
    if (lives <= 0) { endGame('lost'); return; }

    answered = false;
    stamp.classList.remove('show', 'wrong');
    nextBtn.classList.remove('ready');

    currentCorrect = deck[deckIndex];
    flagImg.src = flagUrl(currentCorrect.code);
    flagImg.alt = currentCorrect.name;

    // اختيارات غلط من نفس مجموعة الدول (أو من كل الدول لو المجموعة صغيرة)
    const wrongSource = pool.length >= 4 ? pool : countries;
    const wrongPool = shuffle(wrongSource.filter(c => c.code !== currentCorrect.code)).slice(0, 3);
    const options = shuffle([currentCorrect, ...wrongPool]);

    choicesEl.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = opt.name;
      btn.addEventListener('click', () => selectAnswer(opt, btn));
      choicesEl.appendChild(btn);
    });

    promptLabel.textContent = `متبقّي ${deck.length - deckIndex} في هذه الجولة`;
    updateGameHeader();
  }

  function selectAnswer(chosen, btnEl) {
    if (answered) return;
    answered = true;

    const isCorrect = chosen.code === currentCorrect.code;
    [...choicesEl.children].forEach(btn => {
      btn.disabled = true;
      if (btn.textContent === currentCorrect.name) btn.classList.add('correct');
      else if (btn === btnEl) btn.classList.add('incorrect');
    });

    if (isCorrect) {
      sessionCorrect++;
      knownCodes.add(currentCorrect.code);
      stamp.textContent = 'صحيح';
      stamp.classList.remove('wrong');
    } else {
      lives--;
      stamp.textContent = currentCorrect.name;
      stamp.classList.add('wrong');
    }
    stamp.classList.add('show');
    updateGameHeader();
    nextBtn.classList.add('ready');
  }

  nextBtn.addEventListener('click', () => {
    deckIndex++;
    if (lives <= 0) { endGame('lost'); return; }
    nextRound();
  });

  function endGame(reason) {
    showScreen(endScreen);

    finalScore.textContent = sessionCorrect;
    finalOf.textContent = `صح من ${pool.length} دولة`;

    if (reason === 'cleared') {
      endIcon.textContent = '🏆';
      finalMsg.textContent = 'برافو! خلّصت كل الدول المتاحة هنا من غير ما تخسر تلات مرات!';
    } else if (sessionCorrect === 0) {
      endIcon.textContent = '🗺️';
      finalMsg.textContent = 'محتاج تراجع خريطة العالم شوية، جرب تاني!';
    } else if (sessionCorrect >= pool.length * 0.7) {
      endIcon.textContent = '👏';
      finalMsg.textContent = 'أداء رائع! خسرت بس بعد ما عرفت كتير.';
    } else {
      endIcon.textContent = '🚩';
      finalMsg.textContent = 'مش بطال! كمّل تلعب وهتحسّن رقمك.';
    }

    renderProgressList();
  }

  function renderProgressList() {
    progressRows.innerHTML = '';

    const totalRow = document.createElement('div');
    totalRow.className = 'pl-row total';
    totalRow.innerHTML = `
      <div class="pl-top"><span>🌐 العالم كله</span><b>${knownCodes.size} / ${countries.length}</b></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(knownCodes.size/countries.length)*100}%"></div></div>
    `;
    progressRows.appendChild(totalRow);

    CONTINENTS.forEach(cont => {
      const total = countInContinent(cont.key);
      const known = knownInContinent(cont.key);
      const row = document.createElement('div');
      row.className = 'pl-row';
      row.innerHTML = `
        <div class="pl-top"><span>${cont.emoji} ${cont.name}</span><b>${known} / ${total}</b></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(known/total)*100}%"></div></div>
      `;
      progressRows.appendChild(row);
    });
  }

  restartBtn.addEventListener('click', () => startGame(currentContinentKey));
  menuBtn.addEventListener('click', () => { renderMenu(); showScreen(menuScreen); });
  backBtn.addEventListener('click', () => { renderMenu(); showScreen(menuScreen); });

  renderMenu();
  showScreen(menuScreen);
</script>

</body>
</html>
